<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant RAG — Corte</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1e3a5f;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.7; margin-top: 2px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bubble.user {
      background: #1e3a5f;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      background: white;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .bubble.warning {
      background: #fff8e1;
      color: #7a5c00;
      border-left: 3px solid #f0b429;
    }

    .sources {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      text-decoration: none;
      cursor: pointer;
    }
    .chip:hover { background: #c7d2fe; }

    .inline-link {
      color: #2563eb;
      text-decoration: underline dotted;
      font-weight: 500;
    }
    .inline-link:hover { color: #1d4ed8; }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    footer {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
    }
    .input-row {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #1e3a5f; }

    button {
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover    { background: #2a4f7e; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🏛️ Assistant RAG — Corte</h1>
    <p>Tourisme · Hébergement · Activités</p>
  </div>
</header>

<div id="chat"></div>

<footer>
  <div class="input-row">
    <input id="input" type="text" placeholder="Posez votre question…" autocomplete="off" />
    <button id="btn" onclick="sendQuery()">Envoyer</button>
  </div>
</footer>

<script>
  const chat  = document.getElementById("chat");
  const input = document.getElementById("input");
  const btn   = document.getElementById("btn");

  input.addEventListener("keydown", e => { if (e.key === "Enter") sendQuery(); });

  function addBubble(cls) {
    const wrap   = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = `bubble ${cls}`;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return { wrap, bubble };
  }

  function addSources(wrap, sources) {
    if (!sources.length) return;
    const row = document.createElement("div");
    row.className = "sources";
    sources.forEach(s => {
      const chip = document.createElement("a");
      chip.className = "chip";
      chip.href = s.url;
      chip.target = "_blank";
      chip.rel = "noopener noreferrer";
      chip.textContent = `📄 ${s.label}${s.dist !== null ? " · " + s.dist : ""}`;
      row.appendChild(chip);
    });
    wrap.appendChild(row);
  }

  function linkify(text, sources) {
    // Échappe le texte brut pour éviter l'injection HTML
    let safe = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");

    // Remplace chaque nom de source cité dans le texte par un lien
    sources.forEach(s => {
      if (!s.url) return;
      const escaped = s.label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(escaped, "gi");
      safe = safe.replace(re, `<a href="${s.url}" target="_blank" rel="noopener" class="inline-link">${s.label}</a>`);
    });
    return safe;
  }

  function addTyping() {
    const { wrap } = addBubble("bot typing");
    wrap.querySelector(".bubble").innerHTML = "<span></span><span></span><span></span>";
    return wrap;
  }

  async function sendQuery() {
    const q = input.value.trim();
    if (!q) return;

    const { bubble: userBubble } = addBubble("user");
    userBubble.textContent = q;
    input.value = "";
    btn.disabled = true;

    const loader = addTyping();

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q })
      });

      loader.remove();
      const { wrap, bubble } = addBubble("bot");
      bubble.textContent = "";

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const data = JSON.parse(line.slice(5).trim());

          if (data.token) {
            fullText += data.token;
            bubble.textContent = fullText;
            chat.scrollTop = chat.scrollHeight;
          } else if (data.error) {
            bubble.className = "bubble warning";
            bubble.textContent = data.error === "no_results"
              ? "⚠️ Aucun document trouvé pour cette question."
              : "⚠️ Les passages trouvés ne sont pas assez pertinents.";
          } else if (data.done) {
            // Linkifier les sources citées dans le texte de la réponse
            bubble.innerHTML = linkify(fullText, data.sources || []);
            addSources(wrap, data.sources || []);
          }
        }
      }
    } catch {
      loader.remove();
      const { bubble } = addBubble("bot warning");
      bubble.textContent = "❌ Erreur de connexion avec le serveur.";
    }

    btn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
