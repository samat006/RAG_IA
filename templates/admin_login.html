<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Back-office AroBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e3a5f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 36px 32px;
      width: 340px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    h1 { font-size: 1.2rem; margin-bottom: 4px; color: #1e3a5f; }
    p.subtitle { color: #8a93a3; font-size: 0.85rem; margin-bottom: 22px; }
    label { display: block; font-size: 0.8rem; color: #556; margin-bottom: 6px; font-weight: 600; }
    input[type=password] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d6dbe2;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 18px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #16304d; }
    .error {
      background: #fdecea;
      color: #8f251f;
      border: 1px solid #f5c2bd;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛠️ Back-office AroBot</h1>
    <p class="subtitle">Connexion administrateur</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
