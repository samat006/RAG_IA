<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Back-office{% endblock %} — AroBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1e2430;
      min-height: 100vh;
    }
    header {
      background: #1e3a5f;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header .brand { font-size: 1.05rem; font-weight: 600; }
    header nav a {
      color: #cfe0f7;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
    }
    header nav a:hover { color: white; text-decoration: underline; }
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    h2 { font-size: 1.05rem; margin-bottom: 12px; color: #1e3a5f; }
    p.subtitle { color: #667; font-size: 0.9rem; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef0f3; }
    th { color: #667; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover { background: #f8f9fb; }
    code {
      background: #f0f2f5;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    a.btn, button.btn {
      display: inline-block;
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }
    a.btn:hover, button.btn:hover { background: #16304d; }
    button.btn.danger { background: #b4302a; }
    button.btn.danger:hover { background: #8f251f; }
    button.btn.secondary { background: #6b7684; }
    button.btn.secondary:hover { background: #565f6b; }
    input[type=text], input[type=password], input[type=number], input[type=url], select {
      padding: 8px 10px;
      border: 1px solid #d6dbe2;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }
    input[type=file] { font-size: 0.85rem; }
    label { display: block; font-size: 0.8rem; color: #556; margin-bottom: 4px; font-weight: 600; }
    .field { margin-bottom: 14px; flex: 1; }
    .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .pill {
      display: inline-block;
      background: #eef2f7;
      color: #45536a;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
    .muted { color: #8a93a3; font-size: 0.85rem; }
    .error {
      background: #fdecea;
      color: #8f251f;
      border: 1px solid #f5c2bd;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.88rem;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f1f4;
      font-size: 0.9rem;
    }
    .list-item:last-child { border-bottom: none; }
    form.inline { display: inline; }
    .checkbox-line { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.88rem; color: #333; }
    .checkbox-line input[type=checkbox] { width: auto; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛠️ AroBot — Back-office</div>
    <nav>
      <a href="{{ url_for('admin.dashboard') }}">Tableau de bord</a>
      <a href="{{ url_for('admin.settings_view') }}">Réglages</a>
      <a href="{{ url_for('admin.logout') }}">Déconnexion</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
